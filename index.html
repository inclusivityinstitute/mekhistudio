o first, and why? Write one or two sentences or explain it to your reviewer.","outcome":"Submitted answers and a short practical response; parent verifies real-world performance separately."},{"id":"W04D2","week":4,"day":2,"weekName":"G1 signs and symbols","title":"Warning signs","area":"g1","objective":"Recognize common yellow warning signs.","reading":"Yellow diamond-shaped signs warn of conditions ahead. They might show a curve, slippery road or pedestrian crossing. Slow down and respond to the situation.","mission":"Identify three warnings in the sign atlas.","visual":"signs","steps":["Read or listen to the short explanation.","Complete the practice questions.","Do the real-world challenge or write a plan.","Check your answers, then record how much help you needed."],"expectedMinutes":30,"prompt":"What would you do first, and why? Write one or two sentences or explain it to your reviewer.","outcome":"Submitted answers and a short practical response; parent verifies real-world performance separately."},{"id":"W04D3","week":4,"day":3,"weekName":"G1 signs and symbols","title":"School and pedestrian areas","area":"g1","objective":"Explain safe action near schools and crossings.","reading":"People walking may be difficult to see. Watch carefully near schools and pedestrian crossings. Always obey signs, signals and crossing guards.","mission":"Explain your response to a pedestrian at a crossing.","visual":"signs","steps":["Read or listen to the short explanation.","Complete the practice questions.","Do the real-world challenge or write a plan.","Check your answers, then record how much help you needed."],"expectedMinutes":30,"prompt":"What would you do first, and why? Write one or two sentences or explain it to your reviewer.","outcome":"Submitted answers and a short practical response; parent verifies real-world performance separately."},{"id":"W04D4","week":4,"day":4,"weekName":"G1 signs and symbols","title":"Railway crossings","area":"g1","objective":"Understand crossing warnings and barriers.","reading":"Never drive around a lowered railway barrier. Look and listen for trains and follow the signals and signs.","mission":"Choose the safe response in a crossing scenario.","visual":"signs","steps":["Read or listen to the short explanation.","Complete the practice questions.","Do the real-world challenge or write a plan.","Check your answers, then record how much help you needed."],"expectedMinutes":30,"prompt":"What would you do first, and why? Write one or two sentences or explain it to your reviewer.","outcome":"Submitted answers and a short practical response; parent verifies real-world performance separately."},{"id":"W04D5","week":4,"day":5,"weekName":"G1 signs and symbols","title":"Road-sign review","area":"g1","objective":"Review stop, yield, warnings and speed signs.","reading":"Knowing the shape and colour of a sign can help you recognize its purpose. The meaning and required action are more important than memorizing the picture alone.","mission":"Complete the sign atlas review and explain two signs aloud.","visual":"signs","steps":["Read or listen to the short explanation.","Complete the practice questions.","Do the real-world challenge or write a plan.","Check your answers, then record how much help you needed."],"expectedMinutes":30,"prompt":"What would you do first, and why? Write one or two sentences or explain it to your reviewer.","outcome":"Submitted answers and a short practical response; parent verifies real-world performance separately."},{"id":"W05D1","week":5,"day":1,"weekName":"G1 rules and judgment","title":"Intersections","area":"g1","objective":"Read an intersection and identify the safest action.","reading":"At intersections, check signs, signals, pedestrians and approaching vehicles. A green signal does not remove the duty to make sure the way is clear.","mission":"Describe what you check before entering an intersection.","visual":"junction","steps":["Read or listen to the short explanation.","Comple window.MEKHI_QUESTIONS={"g1":[{"q":"What must a driver do at a STOP sign?","options":["Come to a complete stop","Slow down only","Stop only if another car is nearby"],"answer":0,"why":"A STOP sign always requires a full stop."},{"q":"Which shape is a STOP sign?","options":["Yellow diamond","Red octagon","White rectangle"],"answer":1,"why":"The familiar STOP sign is an eight-sided red sign."},{"q":"At a YIELD sign, a driver should…","options":["Speed up to join traffic","Give right-of-way and stop if necessary","Always reverse"],"answer":1,"why":"YIELD means allow other traffic or pedestrians to go first."},{"q":"Yellow diamond road signs usually…","options":["Warn about a condition ahead","Identify a parking ticket","Give the weather forecast"],"answer":0,"why":"Most yellow diamond signs are warnings."},{"q":"A white sign with a posted speed number usually tells you…","options":["A recommended speed for racing","The maximum speed allowed under normal conditions","Distance to a city"],"answer":1,"why":"Obey posted speed limits and slow further if conditions require."},{"q":"If a pedestrian is already crossing at a crosswalk, you should…","options":["Yield and wait as required","Honk and continue","Drive around them"],"answer":0,"why":"Pedestrian safety and the applicable right-of-way rules come first."},{"q":"A green traffic light means…","options":["Proceed only if the way is clear","Ignore people crossing","You may drive as fast as you like"],"answer":0,"why":"Green does not remove the duty to drive safely."},{"q":"A flashing red traffic signal generally means…","options":["Treat it like a stop sign","Never slow down","The road is closed permanently"],"answer":0,"why":"A flashing red is treated as a stop, then proceed when safe and lawful."},{"q":"Before changing lanes, you should…","options":["Signal, check mirrors and blind spot","Only signal after moving","Look only at the speedometer"],"answer":0,"why":"A safe lane change requires checks and a signal."},{"q":"Does signalling give you the right-of-way?","options":["Yes, always","No, check it is safe","Only at night"],"answer":1,"why":"A signal communicates intent, not permission."},{"q":"In heavy rain, a sensible driving change is to…","options":["Leave more following distance","Drive closer to the car ahead","Brake suddenly"],"answer":0,"why":"Slippery roads require extra space and caution."},{"q":"If you approach a lowered railway crossing barrier, you should…","options":["Drive around it","Stop and wait","Race the train"],"answer":1,"why":"Never enter a crossing against a barrier."},{"q":"Before entering an intersection you should check…","options":["Signals, pedestrians and traffic","Only the radio","Only the clock"],"answer":0,"why":"A full safety scan helps avoid conflicts."},{"q":"If an emergency vehicle approaches with lights and siren, you should…","options":["React safely and follow Ontario rules for yielding","Block it","Follow close behind it"],"answer":0,"why":"Give emergency vehicles space and yield safely."},{"q":"Why can a school area require extra care?","options":["Children may move unexpectedly","Signs no longer apply","Drivers can ignore crosswalks"],"answer":0,"why":"Watch carefully for children and follow signs or guards."},{"q":"What is a blind spot?","options":["An area not easily seen in mirrors","A broken windshield only","The trunk"],"answer":0,"why":"Turn your head to check blind spots before a lane change."},{"q":"If you are too tired to drive safely, you should…","options":["Stop somewhere safe and rest","Turn up the music and continue","Drive faster to finish"],"answer":0,"why":"Fatigue impairs safe driving."},{"q":"A red circle with a slash across a symbol often means…","options":["The action is prohibited","The action is recommended","The road is a scenic route"],"answer":0,"why":"Prohibitory signs indicate restrictions."},{"q":"On an icy road, sudden braking can…","options":["Increase skidding risk","Always improve grip","Dry the road"],"answer":0,"why":"Adjust speed and braking gently to conditions."},{"q":"What should you do when a crossing guard signals traffic to stop?","options":["Stop and follow their direction","Ignore them if your light is green","Continue if no cars are coming"],"answer":0,"why":"Obey directions from authorized crossing guards."},{"q":"If traffic ahead is stopped, is it safe to enter an intersection you cannot clear?","options":["No","Yes if the signal is green","Only if you honk"],"answer":0,"why":"Do not block an intersection."},{"q":"A railway crossing warning sign tells you to…","options":["Watch for trains and obey signals","Park on the tracks","Ignore barriers"],"answer":0,"why":"Look for and obey all railway warnings."},{"q":"When should you check your mirrors?","options":["Regularly and before manoeuvres","Only after parking","Never"],"answer":0,"why":"Frequent mirror checks help maintain awareness."},{"q":"A driver sees a cyclist beside the roadway. What should they do?","options":["Provide appropriate space and remain alert","Pass dangerously close","Sound the horn constantly"],"answer":0,"why":"Give vulnerable road users safe room."},{"q":"A traffic sign you do not recognize appears. Best response?","options":["Slow appropriately and use caution","Assume it does not matter","Close your eyes"],"answer":0,"why":"Act cautiously and learn the sign from the official handbook."},{"q":"Where should you verify Ontario G1 rules?","options":["Official MTO Driver’s Handbook","Random social media comments","A video game"],"answer":0,"why":"Use the official provincial handbook."},{"q":"An orange diamond sign commonly warns about…","options":["Temporary road work or conditions","A hospital only","A library"],"answer":0,"why":"Orange signs often indicate construction and temporary hazards."},{"q":"What is a safe following distance for?","options":["Allowing time to react","Making traffic faster","Saving fuel by tailgating"],"answer":0,"why":"Space between vehicles improves reaction time."},{"q":"On a wet road, stopping distance may…","options":["Increase","Always decrease","Stay identical"],"answer":0,"why":"Wet surfaces can reduce traction."},{"q":"When making a turn, a driver should watch for…","options":["Pedestrians and cyclists","Only vehicles behind them","Only their music"],"answer":0,"why":"Check all road users around a turn."},{"q":"If you do not understand a G1 rule, you should…","options":["Revisit the handbook and ask for clarification","Memorize a guess","Ignore it"],"answer":0,"why":"Understanding is more important than guessing."},{"q":"What is defensive driving?","options":["Anticipating hazards and planning safe responses","Driving aggressively","Only watching the car ahead"],"answer":0,"why":"Defensive driving means anticipating risk."},{"q":"What is the safest response to an unfamiliar intersection?","options":["Slow, observe signs and proceed only when safe","Close your eyes","Follow another car without checking"],"answer":0,"why":"Use signs, signals and observation to guide your decision."},{"q":"Why should you avoid using a phone while driving?","options":["It distracts attention","It improves braking","It helps see pedestrians"],"answer":0,"why":"Distraction increases collision risk."},{"q":"If another driver behaves aggressively, you should…","options":["Avoid confrontation and keep safe space","Race them","Block their lane"],"answer":0,"why":"Keep focused on safety, not conflict."},{"q":"Where can you verify G1 licence conditions?","options":["Ontario’s official licensing information","A stranger’s advice","An old screenshot without context"],"answer":0,"why":"Official licensing information is the authoritative starting point."}],"money":[{"q":"You have $75 and spend $48. How much remains?","options":["$27","$23","$37"],"answer":0,"why":"75 minus 48 is 27."},{"q":"Four items cost $6 each. What is the total?","options":["$10","$24","$30"],"answer":1,"why":"4 × 6 = 24."},{"q":"Which offer costs less per item?","optio function recordDateKey(r){if(!r||!r.date)return '';try{return keyForDate(torontoParts(new Date(r.date)))}catch{return ''}}
function quizForSlot(s,date){
 if(s.time==='13:00')return records.some(r=>r.type==='lesson'&&r.synced===true&&r.id===lessonForToday().id&&recordDateKey(r)===date&&passRecorded(r));
 if(s.time==='09:30')return records.some(r=>r.type==='road'&&r.synced===true&&recordDateKey(r)===date&&passRecorded(r));
 return false;
}
function localStarSummary(){
 const scores=new Map();
 for(const r of records){if(!r.synced||!passRecorded(r))continue;const k=r.type==='road'?'road:'+recordDateKey(r):'lesson:'+r.id;

  scores.set(k,Math.max(scores.get(k)||0,1+(selfStart?1:0)));
 }
 const lessonStars=[...scores.values()].reduce((a,b)=>a+b,0);
 const photoStars=Object.values(proofState).filter(p=>p&&p.uid&&p.synced).length;
 return {stars:lessonStars+photoStars,lessonStars,photoStars,photosPending:Object.values(proofState).filter(p=>p&&p.uid&&!p.synced).length};
}

function renderSlot(s,minute,date){

me)} ${button('View photo','view-evidence','ghost small',`data-attempt="${esc(r.uid)}"`)}</p>`:''}<div class="form-grid"><label><span class="label small">Practical verification</span><select class="input review-select" data-attempt="${esc(r.uid)}">${STATUSES.map(x=>`<option ${r.review===x?'selected':''}>${x}</option>`).join('')}</select></label><div style="display:flex;align-items:end">${button('View details','review-details','ghost small',`data-attempt="${esc(r.uid)}"`)}</div></div></div>`).join('')}</div>`:'<div class="empty">No submissions to review yet.</div>'}`}

function syncStatusText(){const lessons=records.filter(r=>!r.synced).length,checks=Object.entries(plan).filter(([k,v])=>v&&!checkAck[k]).length,photos=Object.values(proofState).filter(p=>p&&p.uid&&!p.synced).length;return config.syncEnabled?`${lessons} lesson(s), ${checks} checklist tick(s), ${photos} photo(s) awaiting Google confirmation. These are NOT submitted yet.`:'Cloud reporting is OFF on this address. Work does not count as submitted until Google confirms receiving it. Do not clear Safari website data.'}
function formatClock(sec){sec=Math.max(0,Math.round(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function resetTimer(){focusRunning=false;focusDeadline=0;focusRemaining=25*60}
function toggleTimer(){if(focusRunning){focusRemaining=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000));focusRunning=false}else{focusDeadline=Date.now()+focusRemaining*1000;focusRunning=true}}
setInterval(()=>{if(!focusRunning)return;focusRemaining=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000));const clock=document.querySelector('#focusClock');if(clock)clock.textContent=formatClock(focusRemaining);if(!focusRemaining){focusRunning=false;toast('Your focus block is complete. Check your work and move on.')}},1000);
// Image evidence remains on this device only. It never travels through the optional result-sync endpoint.
const EVIDENCE_DB='mekhi-studio-photos-v2';
function openEvidenceDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('photo storage unavailable'));const r=indexedDB.open(EVIDENCE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('photo database could not open'))})}
async function storeEvidence(file,uid){if(!file.type.startsWith('image/'))throw Error('Only images are accepted');if(file.size>12*1024*1024)throw Error('Photo is larger than 12 MB');const db=await openEvidenceDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(file,uid);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||Error('Photo could not be stored'))}})}
async function viewEvidence(uid){try{const db=await openEvidenceDB();const file=await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').get(uid);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();if(!file)return toast('Photo is not on this device.');const url=URL.createObjectURL(file);const dialog=document.createElement('dialog');dialog.className='image-dialog';dialog.innerHTML=`<div class="label-row"><strong>Practical work photo</strong><button class="btn ghost small" type="button">Close</button></div><img src="${url}" alt="Photo submitted for practical work" style="width:100%;height:auto;max-height:75vh;object-fit:contain"><p class="small muted">This photo is stored on this device, not in the parent Google Sheet.</p>`;document.body.appendChild(dialog);const close=()=>{dialog.close();dialog.remove();URL.revokeObjectURL(url)};dialog.querySelector('button').addEventListener('click',close);dialog.addEventListener('cancel',e=>{e.preventDefault();close()});dialog.showModal()}catch(e){toast('Photo could not be opened on this device.')}}

async function prepareProof(file){
 if(!file||!file.type.startsWith('image/'))throw Error('Choose a photo.');
 if(file.size>20*1024*1024)throw Error('Choose a smaller photo.');
 const url=URL.createObjectURL(file),img=new Image();
 try{await new Promise((ok,bad)=>{img.onload=ok;img.onerror=()=>bad(Error('Cannot open photo'));img.src=url})}
 finally{URL.revokeObjectURL(url)}
 const ratio=Math.min(1,760/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*ratio));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*ratio));
 const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
 let data;for(const q of [.7,.6,.48,.35]){data=c.toDataURL('image/jpeg',q);if(data.length<=235000)break}
 if(data.length>235000)throw Error('Photo too large. Try a simpler picture.');
 const raw=atob(data.split(',')[1]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 return {data,blob:new Blob([bytes],{type:'image/jpeg'})};
}

async function retryProofs(){

 case'photo-slot':{
  const slot=el.dataset.slot,index=Number(el.dataset.index);
  const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.setAttribute('capture','environment');picker.style.display='none';
  document.body.appendChild(picker);
  picker.addEventListener('change',async()=>{const file=picker.files&&picker.files[0];picker.remove();if(!file)return;try{await capturePractical(file,slot,index)}catch(err){toast('Photo failed: '+err.message)}});
  picker.click();break;
 }
 case'view-slot-photo':await viewEvidence(el.dataset.uid);break;
 case'slot-note':{
  const slot=el.dataset.slot,index=Number(el.dataset.index),note=prompt('What activity did you do and for how many minutes? No selfie needed.',planNotes[slot]||'');
  if(note!==null){planNotes[slot]=note.slice(0,160);plan[slot]=true;save();render();await syncCheck(slot,index,true,planNotes[slot])}
  break;
 }
 case'retry-proofs':await retryProofs();break;
 case'retry-checks':await retryChecks();break;
 case'toggle-slot':{
  const slot=el.dataset.slot,index=Number(el.dataset.index),checked=!plan[slot];
  plan[slot]=checked;checkAck[slot]=false;save();render();await syncCheck(slot,index,checked,planNotes[slot]||'');break;
 }

 case'slot-open':{let k=el.dataset.kind;if(k==='road')navigate('road');else if(k==='tools')showTool('budget');else if(k==='work')showTool('career');else navigate('learn',chosenId);break}
 case'add-budget':basket.push({name:'',qty:1,price:0});saveBudget();render();break;
 case'remove-budget':basket.splice(+el.dataset.index,1);saveBudget();render();break;
 case'reset-budget':basket=[{name:'Bread',qty:1,price:4},{name:'Milk',qty:1,price:5},{name:'Eggs',qty:1,price:6}];saveBudget();render();break;
 case'save-budget':updateBudgetFields();toast('Budget saved in this browser.');break;
 case'check-form':testForm();break;
 case'check-airport':{const a=$('#gateChoice').value;$('#airportFeedback').innerHTML=`<div class="note ${a==='C14'?'':'warning'}">${a==='C14'?'Correct. ZX204 is listed at C14.':'Review the ZX204 row. Look across to the GATE column.'}</div>`;break}
 case'roster-answer':$('#rosterFeedback').innerHTML=`<div class="note ${el.dataset.value==='1'?'':'warning'}">${el.dataset.value==='1'?'Correct. 08:00 to 10:00 is two hours.':'Try counting from 8 to 10 again.'}</div>`;break;
 case'save-career':{const chosen=[...document.querySelectorAll('.career-option:checked')].map(x=>x.value);localStorage.setItem('mekhi-career-interests',JSON.stringify(chosen));toast(chosen.length?`${chosen.length} work task interest(s) saved.`:'Choose a task you might try first.');break}
 case'speak-lesson':speak(getLesson().reading);break;
 case'speak-slow':speak(getLesson().reading,.75);break;
 case'stop-voice':stopVoice();break;
 case'toggle-text':bigText=!bigText;render();break;
 case'test-voice':speak('Take your time. Read one step, try it, and check the result.');break;
 case'export-csv':exportCSV();break;
 case'share-csv':await shareCSV();break;
 case'export-json':exportJSON();break;
 case'review-details':saveReviewDetails(el.dataset.attempt);break;
 case'view-evidence':await viewEvidence(el.dataset.attempt);break;
 case'timer-toggle':toggleTimer();render();break;
 case'timer-reset':resetTimer();render();break;
 case'open-settings':navigate('settings');break;
 case'open-parent':navigate('parent');break;
 case'print-page':window.print();break;
 case'save-sync':{const u=$('#scriptUrl').value.trim(),k=$('#syncKey').value.trim(),enabled=$('#syncEnabled').checked;if(enabled&&(!isValidScriptUrl(u)||k.length<20)){toast('Use a valid Google Apps Script /exec URL and a token of at least 20 characters.');break}config={scriptUrl:u,syncKey:k,syncEnabled:enabled};saveConfig();render();toast('Sync settings saved.');break}
 case'test-sync':{if(!config.syncEnabled){toast('Save and enable sync first.');break}$('#syncStatus').textContent='Sending test…';try{const r=await sendPayload({uid:'test-'+genId(),type:'test',id:'TEST',title:'Connection test',date:new Date().toISOString(),correct:0,total:0});$('#syncStatus').textContent='Connection confirmed by Google Script.';toast('Test sync confirmed.')}catch(err){$('#syncStatus').textContent='Test not confirmed: '+err.message;toast('Cloud sync not confirmed.')}}break;
 case'retry-sync':await retrySync();break;
 default:break;
 }
});
$('#brandHome').addEventListener('click',()=>navigate('today'));
$('#settingsButton').addEventListener('click',()=>navigate('settings'));
$('#soundButton').addEventListener('click',()=>{if(page==='learn')speak(getLesson().reading);else speak('Welcome to Mekhi Studio. Select Today to begin your learning.');});
window.addEventListener('hashchange',route);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
route();
})();

</script>
